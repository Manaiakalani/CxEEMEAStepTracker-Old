<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - CxE EMEA Step Tracker</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta http-equiv="refresh" content="0; url=./admin/dist/#/login">
    <script>
        // The admin console has been ported to a modern React SPA.
        // Redirect to the new login route; this page is now just a stub.
        try { window.location.replace('./admin/dist/#/login'); } catch (_) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #2E5A88 0%, #1f3f60 60%, #2F5D3A 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }
        .card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(16px) saturate(140%);
            -webkit-backdrop-filter: blur(16px) saturate(140%);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 24px 48px rgba(15, 23, 42, 0.18);
            max-width: 420px;
            width: 100%;
        }
        h1 { margin: 0 0 8px; font-family: 'Fraunces', Georgia, serif; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
        p { margin: 0; opacity: 0.9; }
        a {
            color: #fff;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            border-radius: 8px;
            background: rgba(255,255,255,0.16);
            transition: background 0.15s ease;
        }
        a:hover { background: rgba(255,255,255,0.28); }
        .back { background: transparent; font-weight: 400; opacity: 0.7; margin-top: 12px; padding: 6px 0; }
        .back:hover { background: transparent; opacity: 1; }
    </style>
</head>
<body>
    <div class="card">
        <div style="font-size:48px;margin-bottom:16px;">🔐</div>
        <h1>Admin console moved</h1>
        <p>Redirecting you to the new admin interface…</p>
        <a href="./admin/dist/#/login">Continue to admin login →</a><br>
        <a class="back" href="index.html">← Back to Step Tracker</a>
    </div>
